# Highlight.io — Coolify Docker Compose (hobby self-host)
#
# USAGE
#   1. Commit this file to your highlight fork at: docker/compose.coolify.yml
#   2. In Coolify: New Resource -> Public Repository -> your fork URL.
#        - Branch: main
#        - Build Pack: Docker Compose
#        - Docker Compose Location: /docker/compose.coolify.yml
#        - Base Directory: /
#   3. In Coolify's "Environment Variables" tab, set:
#        ADMIN_PASSWORD=<strong password>
#        JWT_ACCESS_SECRET=<random 32+ char string>
#      Coolify auto-generates SERVICE_FQDN_FRONTEND_3000 and
#      SERVICE_FQDN_BACKEND_8082 (override in the UI for custom domains).
#   4. Deploy. Frontend appears at https://<SERVICE_FQDN_FRONTEND_3000>.
#      Log in with any email + ADMIN_PASSWORD.
#
# NOTES
#   - Relative paths (./config.xml, ../backend/env.enc, ../backend/localhostssl/*)
#     resolve against the /docker/ dir of the cloned repo — they all exist there.
#   - SSL=false is correct: Coolify's Traefik terminates TLS; containers speak HTTP
#     internally. The frontend entrypoint strips `ssl` directives from nginx.conf
#     when SSL=false, but the cert files still need to be mounted (nginx config
#     references the paths at parse time).
#   - SERVICE_FQDN_* is the bare domain in Coolify (no protocol), so REACT_APP_*
#     URIs prepend https:// explicitly.
#   - Image tags pinned to docker-v0.5.2 (matches Highlight's reference .env).
#     Bump together when you upgrade; do not use :latest.
#   - Postgres uses ankane/pgvector — Highlight's embeddings code requires the
#     vector extension. Plain postgres:15 will fail migrations.
#   - The OTel collector is omitted. Browser-side session replay + errors work
#     (SDKs talk to the public graph directly). Server-side OTLP ingestion does
#     NOT work without it — add the collector service later if you need it.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ───── Infrastructure ─────────────────────────────────────────────
  postgres:
    image: ankane/pgvector:v0.5.1
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:8.0.2
    restart: on-failure
    command: redis-server --save "" --appendonly no
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    restart: on-failure
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    logging: *default-logging

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    restart: on-failure
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    logging: *default-logging

  clickhouse:
    image: clickhouse/clickhouse-server:24.3.15.72-alpine
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_started
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./config.xml:/etc/clickhouse-server/config.d/highlight.xml:ro
      - ./users.xml:/etc/clickhouse-server/users.d/highlight.xml:ro
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  # ───── Highlight services ─────────────────────────────────────────
  backend:
    image: ghcr.io/highlight/highlight-backend:docker-v0.5.2
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - highlight-data:/highlight-data
      - ../backend/env.enc:/build/env.enc:ro
      - ../backend/env.enc.dgst:/build/env.enc.dgst:ro
      - ../backend/localhostssl/server.key:/build/localhostssl/server.key:ro
      - ../backend/localhostssl/server.crt:/build/localhostssl/server.crt:ro
    environment:
      - SERVICE_FQDN_BACKEND_8082
      - SSL=false
      - ON_PREM=true
      - ENVIRONMENT=dev
      - DISABLE_CORS=false
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - REACT_APP_AUTH_MODE=password
      - REACT_APP_FRONTEND_URI=https://${SERVICE_FQDN_FRONTEND_3000}
      - OAUTH_REDIRECT_URL=https://${SERVICE_FQDN_BACKEND_8082}/private/oauth/callback
      - ENABLE_OBJECT_STORAGE=false
      - OBJECT_STORAGE_FS=/highlight-data
      - SESSION_FILE_PATH_PREFIX=/tmp/
      - PSQL_HOST=postgres
      - PSQL_PORT=5432
      - PSQL_USER=postgres
      - PSQL_PASSWORD=postgres
      - PSQL_DB=postgres
      - CLICKHOUSE_ADDRESS=clickhouse:9000
      - CLICKHOUSE_DATABASE=default
      - CLICKHOUSE_USERNAME=default
      - CLICKHOUSE_PASSWORD=
      - REDIS_EVENTS_STAGING_ENDPOINT=redis:6379
      - KAFKA_SERVERS=kafka:9092
      - KAFKA_TOPIC=dev
    logging: *default-logging

  frontend:
    image: ghcr.io/highlight/highlight-frontend:docker-v0.5.2
    restart: on-failure
    depends_on:
      - backend
    volumes:
      - ../backend/localhostssl/server.key:/etc/ssl/private/ssl-cert.key:ro
      - ../backend/localhostssl/server.pem:/etc/ssl/certs/ssl-cert.pem:ro
    environment:
      - SERVICE_FQDN_FRONTEND_3000
      - SSL=false
      - REACT_APP_AUTH_MODE=password
      - REACT_APP_PRIVATE_GRAPH_URI=https://${SERVICE_FQDN_BACKEND_8082}/private
      - REACT_APP_PUBLIC_GRAPH_URI=https://${SERVICE_FQDN_BACKEND_8082}/public
      - REACT_APP_FRONTEND_URI=https://${SERVICE_FQDN_FRONTEND_3000}
      - REACT_APP_DISABLE_ANALYTICS=true
    logging: *default-logging

volumes:
  postgres-data:
  redis-data:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  clickhouse-data:
  clickhouse-logs:
  highlight-data:
