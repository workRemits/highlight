# Highlight.io — Coolify Docker Compose (hobby self-host)
#
# USAGE
#   1. Commit this file to your highlight fork at: docker/compose.coolify.yml
#   2. In Coolify: New Resource -> Public Repository -> your fork URL.
#        - Branch: main
#        - Build Pack: Docker Compose
#        - Docker Compose Location: /docker/compose.coolify.yml
#        - Base Directory: /
#   3. In Coolify's "Environment Variables" tab, set:
#        ADMIN_PASSWORD=<strong password>
#        JWT_ACCESS_SECRET=<random 32+ char string>
#      Coolify auto-generates SERVICE_FQDN_FRONTEND_3000 and
#      SERVICE_FQDN_BACKEND_8082 (override in the UI for custom domains).
#   4. Deploy. Frontend appears at https://<SERVICE_FQDN_FRONTEND_3000>.
#      Log in with any email + ADMIN_PASSWORD.
#
# NOTES
#   - Only ./config.xml and ./users.xml are bind-mounted (ClickHouse needs them
#     at container start). The env.enc / env.enc.dgst / localhostssl files that
#     Highlight's hobby compose mounts are already baked into the images at
#     build time, so we skip those mounts (cross-directory binds break under
#     Coolify's path remapping).
#   - SSL=false is correct: Coolify's Traefik terminates TLS; containers speak
#     HTTP internally. The frontend entrypoint strips `ssl` directives from
#     nginx.conf when SSL=false.
#   - SERVICE_FQDN_BACKEND_8082 and SERVICE_FQDN_FRONTEND_3000 are hardcoded to
#     the public domains. Coolify recognizes the magic names and generates
#     Traefik routing for those hostnames -> the matching container ports.
#     If you change domains, update both the SERVICE_FQDN_* declarations AND
#     the REACT_APP_* / OAUTH_REDIRECT_URL values that reference them.
#   - Image tags pinned to docker-v0.5.6 (matches Highlight's reference .env).
#     Bump together when you upgrade; do not use :latest.
#   - Postgres uses ankane/pgvector — Highlight's embeddings code requires the
#     vector extension. Plain postgres:15 will fail migrations.
#   - The OTel collector is omitted. Browser-side session replay + errors work
#     (SDKs talk to the public graph directly). Server-side OTLP ingestion does
#     NOT work without it — add the collector service later if you need it.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ───── Infrastructure ─────────────────────────────────────────────
  postgres:
    image: ankane/pgvector:v0.5.1
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:8.0.2
    restart: on-failure
    command: redis-server --save "" --appendonly no
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    restart: on-failure
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    logging: *default-logging

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    restart: on-failure
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    logging: *default-logging

  clickhouse:
    image: clickhouse/clickhouse-server:24.3.15.72-alpine
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_started
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./config.xml:/etc/clickhouse-server/config.d/highlight.xml:ro
      - ./users.xml:/etc/clickhouse-server/users.d/highlight.xml:ro
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "clickhouse-client", "--host", "localhost", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging

  # ───── Highlight services ─────────────────────────────────────────
  backend:
    image: ghcr.io/highlight/highlight-backend:docker-v0.5.6
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Override entrypoint to decode GITHUB_PRIVATE_KEY_BASE64 -> GITHUB_PRIVATE_KEY
    # at container start. Coolify's env-file serializer mangles multi-line PEM
    # values (each PEM line gets parsed as a separate KEY=VALUE), so we ship
    # the key as a single-line base64 blob via GITHUB_PRIVATE_KEY_BASE64 and
    # restore the real PEM here. If the base64 var is unset (e.g. before
    # GitHub is wired), this is a no-op.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -n "$$GITHUB_PRIVATE_KEY_BASE64" ]; then
          GITHUB_PRIVATE_KEY="$$(printf '%s' "$$GITHUB_PRIVATE_KEY_BASE64" | base64 -d)"
          export GITHUB_PRIVATE_KEY
        fi
        exec /build/backend -runtime=all
    volumes:
      # Bind mount instead of a Docker named volume. Coolify recreates named
      # volumes on each deploy in some versions, which silently wipes session
      # replay data even though Postgres metadata persists -- dashboard lists
      # old sessions but they play back as blank screens. The ./highlight-data
      # path is relative to the compose file's directory on the Coolify host
      # (under /data/coolify/services/<uuid>/), which IS persistent.
      - ./highlight-data:/highlight-data
    environment:
      - SSL=false
      - IN_DOCKER=true
      - ON_PREM=true
      - ENVIRONMENT=dev
      - DISABLE_CORS=false
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - REACT_APP_AUTH_MODE=password
      - REACT_APP_FRONTEND_URI=https://highlight.workremits.co.uk
      - OAUTH_REDIRECT_URL=https://highlight-api.workremits.co.uk/private/oauth/callback
      - ENABLE_OBJECT_STORAGE=false
      - OBJECT_STORAGE_FS=/highlight-data
      - SESSION_FILE_PATH_PREFIX=/tmp/
      - PSQL_HOST=postgres
      - PSQL_PORT=5432
      - PSQL_USER=postgres
      - PSQL_PASSWORD=postgres
      - PSQL_DB=postgres
      - CLICKHOUSE_ADDRESS=clickhouse:9000
      - CLICKHOUSE_DATABASE=default
      - CLICKHOUSE_USERNAME=default
      - CLICKHOUSE_PASSWORD=
      - REDIS_EVENTS_STAGING_ENDPOINT=redis:6379
      - KAFKA_SERVERS=kafka:9092
      - KAFKA_TOPIC=dev
    labels:
      - traefik.enable=true
      - traefik.http.routers.highlight-backend-http.entrypoints=http
      - traefik.http.routers.highlight-backend-http.rule=Host(`highlight-api.workremits.co.uk`)
      - traefik.http.routers.highlight-backend-http.middlewares=redirect-to-https
      - traefik.http.routers.highlight-backend-https.entrypoints=https
      - traefik.http.routers.highlight-backend-https.rule=Host(`highlight-api.workremits.co.uk`)
      - traefik.http.routers.highlight-backend-https.tls=true
      - traefik.http.routers.highlight-backend-https.tls.certresolver=letsencrypt
      - traefik.http.services.highlight-backend.loadbalancer.server.port=8082
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
    logging: *default-logging

  frontend:
    # Custom wRemit-built frontend: bakes our own OAuth client IDs into the JS
    # bundle (Slack, GitHub App slug, etc.) so OAuth redirects use our apps,
    # not Highlight Cloud's. Built via docker/build-frontend-native.sh; see
    # commit log for which integrations are wired up in each tag.
    image: ghcr.io/workremits/highlight-frontend:v0.5.6-wremit-6-amd64
    restart: on-failure
    depends_on:
      - backend
    environment:
      - SSL=false
      - REACT_APP_AUTH_MODE=password
      - REACT_APP_PRIVATE_GRAPH_URI=https://highlight-api.workremits.co.uk/private
      - REACT_APP_PUBLIC_GRAPH_URI=https://highlight-api.workremits.co.uk/public
      - REACT_APP_FRONTEND_URI=https://highlight.workremits.co.uk
      - REACT_APP_OTLP_ENDPOINT=https://otel.workremits.co.uk
      - REACT_APP_DISABLE_ANALYTICS=true
    labels:
      - traefik.enable=true
      - traefik.http.routers.highlight-frontend-http.entrypoints=http
      - traefik.http.routers.highlight-frontend-http.rule=Host(`highlight.workremits.co.uk`)
      - traefik.http.routers.highlight-frontend-http.middlewares=redirect-to-https
      - traefik.http.routers.highlight-frontend-https.entrypoints=https
      - traefik.http.routers.highlight-frontend-https.rule=Host(`highlight.workremits.co.uk`)
      - traefik.http.routers.highlight-frontend-https.tls=true
      - traefik.http.routers.highlight-frontend-https.tls.certresolver=letsencrypt
      - traefik.http.services.highlight-frontend.loadbalancer.server.port=3000
    logging: *default-logging

  collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    restart: on-failure
    depends_on:
      - backend
    command: ["--config=env:OTEL_CONFIG"]
    environment:
      OTEL_CONFIG: |
        receivers:
          otlp:
            protocols:
              http:
                endpoint: '0.0.0.0:4318'
                max_request_body_size: 0
                include_metadata: true
                cors:
                  allowed_origins:
                    - 'https://*'
                    - 'http://*'
                  allowed_headers:
                    - 'X-Highlight-Request'
                    - 'Origin'
                    - 'Content-Type'
                    - 'Accept'
                    - 'Traceparent'
                    - 'Tracestate'
                  max_age: 7200
        processors:
          batch:
            timeout: 1s
            send_batch_size: 1024
        exporters:
          otlphttp/highlight:
            endpoint: 'http://backend:8082/otel'
            compression: snappy
            timeout: 30s
        service:
          pipelines:
            traces:
              receivers: [otlp]
              processors: [batch]
              exporters: [otlphttp/highlight]
            logs:
              receivers: [otlp]
              processors: [batch]
              exporters: [otlphttp/highlight]
            metrics:
              receivers: [otlp]
              processors: [batch]
              exporters: [otlphttp/highlight]
    labels:
      - traefik.enable=true
      - traefik.http.routers.highlight-otel-http.entrypoints=http
      - traefik.http.routers.highlight-otel-http.rule=Host(`otel.workremits.co.uk`)
      - traefik.http.routers.highlight-otel-http.middlewares=redirect-to-https
      - traefik.http.routers.highlight-otel-https.entrypoints=https
      - traefik.http.routers.highlight-otel-https.rule=Host(`otel.workremits.co.uk`)
      - traefik.http.routers.highlight-otel-https.tls=true
      - traefik.http.routers.highlight-otel-https.tls.certresolver=letsencrypt
      - traefik.http.services.highlight-otel.loadbalancer.server.port=4318
    logging: *default-logging

volumes:
  postgres-data:
  redis-data:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  clickhouse-data:
  clickhouse-logs:
  # highlight-data removed -- now a bind mount on backend service (see comment
  # above) so Coolify persists it across redeploys.
