# Minimal OTel collector config for the wRemit self-hosted Highlight setup.
#
# Receives OTLP HTTP from external backends (the wRemit NestJS app running
# outside this Coolify instance) and forwards everything to the Highlight
# backend at backend:8082 inside the docker network.
#
# This is a stripped-down replacement for Highlight's full collector.yml --
# we drop fluentforward / syslog / awsfirehose / TLS / dogfood pipelines
# because we only need backend-side traces, errors, and logs from one app.

receivers:
    otlp:
        protocols:
            http:
                endpoint: '0.0.0.0:4318'
                max_request_body_size: 0
                include_metadata: true
                cors:
                    allowed_origins:
                        - 'https://*'
                        - 'http://*'
                    allowed_headers:
                        - 'X-Highlight-Request'
                        - 'Origin'
                        - 'Content-Type'
                        - 'Accept'
                        - 'Access-Control-Request-Headers'
                        - 'Access-Control-Request-Method'
                        - 'Access-Control-Allow-Origin'
                        - 'Access-Control-Allow-Methods'
                        - 'Access-Control-Max-Age'
                        - 'Referer'
                        - 'Traceparent'
                        - 'Tracestate'
                    max_age: 7200

processors:
    batch:
        timeout: 1s
        send_batch_size: 1024

exporters:
    otlphttp/highlight:
        endpoint: 'http://backend:8082/otel'
        compression: snappy
        timeout: 30s

service:
    pipelines:
        traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [otlphttp/highlight]
        logs:
            receivers: [otlp]
            processors: [batch]
            exporters: [otlphttp/highlight]
        metrics:
            receivers: [otlp]
            processors: [batch]
            exporters: [otlphttp/highlight]
